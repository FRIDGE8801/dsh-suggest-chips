name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # No explicit version: pnpm/action-setup reads `packageManager` from
      # package.json (pnpm@9.15.0). Passing `version` here while package.json
      # also pins `packageManager` trips the action's version-mismatch guard
      # (ERR_PNPM_BAD_PM_VERSION), so let the field drive it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # --ignore-scripts: the root `prepare` script runs `pnpm build` on
      # install; we build explicitly below so CI can separate install from
      # the build/typecheck/test gates.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify client bundle contract
        run: pnpm verify:client
