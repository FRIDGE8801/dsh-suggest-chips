# dsh-suggest-chips bundle patch: mount the host suggestion plugin.
# The browser half is discovered automatically via the package's
# `dsh.client` declaration (exports["./client"]), so only the host entry is
# inserted here.
- insert:
    - id: suggest-chips
      name: 'dsh-suggest-chips'
      config:
        maxInputBytes: 4096
        maxOutputTokens: 512
        timeoutMs: 60000
        maxRecentTurns: 1
        maxTranscriptChars: 12000
        maxSuggestionChars: 90
        maxSuggestions: 3
